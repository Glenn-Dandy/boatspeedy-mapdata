# Liefert die Kacheln aus, sonst nichts. Kein dynamischer Code, kein Verzeichnis-
# listing, keine Schreibwege — wer die Adresse findet, kann ODbL-Daten laden, und
# das ist ausdrücklich erlaubt.
server {
    listen 80;
    server_name _;

    # Die Dateien liegen unter /srv/mapdata, ausgeliefert wird unter /mapdata/ —
    # also genau unter dem Pfad, den der Reverse-Proxy weiterreicht. Ohne das müsste
    # im Proxy eine Rewrite-Regel den Präfix abschneiden; diese Zeile erspart sie.
    root /srv;
    autoindex off;
    server_tokens off;

    # Das Verzeichnis der Kacheln darf nur kurz zwischengespeichert werden — daran
    # erkennt die App, dass ein neuer Lauf da ist.
    location = /mapdata/index.json {
        gzip_static always;
        gunzip on;
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Die Kacheln liegen als .json.gz auf der Platte. Angefragt wird die .json —
    # nginx nimmt die gepackte Fassung und legt den passenden Kopf dazu; Geräte, die
    # kein gzip mögen, bekommen sie ausgepackt.
    location ~ ^/mapdata/[a-z0-9]+\.json$ {
        gzip_static always;
        gunzip on;
        default_type application/json;
        charset utf-8;

        # Eine Kachel von heute ändert sich bis zum nächsten Lauf nicht mehr. Ein
        # Monat Gültigkeit spart jedem Zwischenspeicher das erneute Holen.
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Zweimal erreichbar: unter /healthz für die Prüfung im Container selbst, unter
    # /mapdata/healthz für den Blick von außen durch den Proxy.
    location ~ ^(/mapdata)?/healthz$ {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
