services:
  # Liefert die fertigen Kacheln aus. Läuft dauerhaft, tut aber nichts weiter, als
  # Dateien zu lesen — gehärtet wie der Web-Container: unveränderliches Dateisystem,
  # keine Rechte, Speicherdeckel.
  mapdata-web:
    image: nginx:alpine
    container_name: mapdata-web
    restart: unless-stopped

    # Der Reverse-Proxy läuft auf einem anderen Rechner, deshalb nicht nur localhost.
    ports:
      - "${MAPDATA_BIND:-0.0.0.0}:${MAPDATA_PORT:-8081}:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data:/srv/mapdata:ro

    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

    mem_limit: 128m
    pids_limit: 128

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Erzeugt die Kacheln. Läuft **nicht** bei `docker compose up` mit — dafür sorgt
  # das Profil. Aufruf: docker compose run --rm mapdata-build
  mapdata-build:
    build: ./build
    image: boatspeedy-mapdata-build:latest
    container_name: mapdata-build
    profiles:
      - build

    # Als der aufrufende Benutzer, nicht als root. Sonst gehören die erzeugten Kacheln
    # root, und ein späteres Aufräumen ohne sudo scheitert.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    volumes:
      - ./data:/out
      - ./build/work:/work
      - ./regions.txt:/build/regions.txt:ro

    security_opt:
      - no-new-privileges:true

    # Genug zum Filtern, nicht genug, um die Maschine umzuwerfen.
    mem_limit: 1500m
