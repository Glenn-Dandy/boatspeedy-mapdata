services:
  # Liefert die fertigen Kacheln aus. Läuft dauerhaft, tut aber nichts weiter, als
  # Dateien zu lesen — gehärtet wie der Web-Container: unveränderliches Dateisystem,
  # keine Rechte, Speicherdeckel.
  mapdata-web:
    image: nginx:alpine
    container_name: mapdata-web
    restart: unless-stopped

    # Der Reverse-Proxy läuft auf einem anderen Rechner, deshalb nicht nur localhost.
    ports:
      - "${MAPDATA_BIND:-0.0.0.0}:${MAPDATA_PORT:-8081}:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data:/srv/mapdata:ro

    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

    mem_limit: 128m
    pids_limit: 128

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Holt alle 30 Minuten die Nachrichten für die Binnenschifffahrt von ELWIS
  # (Sperrungen, Einschränkungen) und legt sie als data/nts.json.gz neben die Kacheln.
  # Die App lädt davon wenige Kilobyte statt selbst 1,5 MB XML von ELWIS.
  mapdata-nts:
    image: python:3.12-alpine
    container_name: mapdata-nts
    restart: unless-stopped
    command: ["python3", "-u", "/nts/nts.py", "/out"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    volumes:
      - ./nts/nts.py:/nts/nts.py:ro
      - ./data:/out

    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 32

    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  # Holt einmal am Tag die Betriebszeiten der Schleusen von ELWIS und legt sie als
  # data/locks.json.gz ab. Liest dafür die Kacheln, um die Schleusen zu verorten.
  mapdata-locks:
    image: python:3.12-alpine
    container_name: mapdata-locks
    restart: unless-stopped
    command: ["python3", "-u", "/locks/locks.py", "/out"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    volumes:
      - ./locks/locks.py:/locks/locks.py:ro
      - ./data:/out

    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 32

    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  # Erzeugt die Kacheln. Läuft **nicht** bei `docker compose up` mit — dafür sorgt
  # das Profil. Aufruf: docker compose run --rm mapdata-build
  mapdata-build:
    build: ./build
    image: boatspeedy-mapdata-build:latest
    container_name: mapdata-build
    profiles:
      - build

    # Als der aufrufende Benutzer, nicht als root. Sonst gehören die erzeugten Kacheln
    # root, und ein späteres Aufräumen ohne sudo scheitert.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    volumes:
      - ./data:/out
      - ./build/work:/work
      # Die Skripte werden **eingehängt**, nicht ins Abbild kopiert. Sonst nimmt
      # `docker compose run` weiter das alte Abbild, und eine Änderung am Skript bleibt
      # ohne Wirkung — genau das ist einmal passiert und hat einen ganzen Lauf gekostet.
      - ./build/build.sh:/build/build.sh:ro
      - ./build/tile.py:/build/tile.py:ro
      - ./regions.txt:/build/regions.txt:ro

    security_opt:
      - no-new-privileges:true

    # Genug zum Filtern und Schneiden, nicht genug, um die Maschine umzuwerfen.
    # Das Schneiden lief anfangs auf 512 MB gegen die Wand; seit es strömend arbeitet,
    # braucht es wenig — der Deckel ist Vorsorge, keine Notwendigkeit.
    mem_limit: 4g
